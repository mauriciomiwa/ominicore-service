openapi: 3.1.0
info:
  title: OminiCore — API de envio
  version: 1.0.0
  description: |
    Serviço interno de notificações multicanal. Só na rede interna (ADR 0003);
    todo pedido exige token do Keycloak (realm `ominicore`, grant
    `client_credentials`, público `ominicore`). Regras: DOC/Negocio/especificacao-negocio.md.
  license:
    name: Proprietária (uso interno)
    identifier: LicenseRef-Proprietary
servers:
  - url: http://ominicore-api:8080
    description: rede interna `aviva`
security:
  - keycloak: []
paths:
  /v1/notificacoes:
    post:
      operationId: pedirNotificacao
      summary: Pedir uma Notificação por Template
      description: |
        Registra a Notificação (RN-1) e enfileira a primeira Tentativa no
        primeiro Canal da Ordem de Canais (a do pedido ou, sem ela, a do
        Template) para o qual o Destinatário tem contato; Canal sem contato é
        pulado, e Falha temporária é retentada até 3 vezes antes de passar ao
        próximo Canal (RN-2). A mesma
        `Idempotency-Key` do mesmo Sistema de origem em até 24 h devolve a
        Notificação já criada, sem novo envio (RN-7).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave de idempotência do Sistema de origem (1 a 255 caracteres).
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoNotificacao"
            example:
              template_id: boas-vindas
              destinatario:
                email: ana@exemplo.com
                telefone: "+5511999998888"
              dados:
                nome: Ana
              canais: [whatsapp, sms, email]
      responses:
        "202":
          description: Notificação aceita (nova ou reutilizada pela chave).
          headers:
            Idempotent-Replayed:
              description: "`true` quando a Notificação já existia para esta chave."
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificacaoAceita"
        "400":
          $ref: "#/components/responses/Problema"
        "401":
          $ref: "#/components/responses/Problema"
        "403":
          description: Token do Console do Operador; ele não pede Notificações nem mexe em Opt-out (REQ-36).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "422":
          $ref: "#/components/responses/Problema"
        "500":
          $ref: "#/components/responses/Problema"
  /v1/notificacoes/{id}:
    get:
      operationId: consultarNotificacao
      summary: Consultar uma Notificação do próprio Sistema de origem
      description: |
        Status da Notificação e de cada Tentativa, atualizado pelos Avisos de
        status dos Provedores (RN-5). Só o Sistema de origem que pediu enxerga;
        para os demais a Notificação não existe (404). Nunca devolve contato do
        Destinatário nem o texto do motivo — só a classificação da falha (RN-9).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notificação e Tentativas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consulta"
        "401":
          $ref: "#/components/responses/Problema"
        "403":
          description: Token do Console do Operador; ele não pede Notificações nem mexe em Opt-out (REQ-36).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          $ref: "#/components/responses/Problema"
        "500":
          $ref: "#/components/responses/Problema"
  /v1/opt-outs:
    post:
      operationId: registrarOptOut
      summary: Registrar o Opt-out de um contato num Canal
      description: |
        Vale para toda a casa (qualquer Sistema de origem) e não expira (RN-8).
        Idempotente. O contato vai no corpo, nunca na URL; o OminiCore guarda
        só um HMAC dele.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptOut"
            example:
              canal: sms
              contato: "+5511999998888"
      responses:
        "204":
          description: Opt-out registrado (ou já existia).
        "400":
          $ref: "#/components/responses/Problema"
        "401":
          $ref: "#/components/responses/Problema"
        "403":
          description: Token do Console do Operador; ele não pede Notificações nem mexe em Opt-out (REQ-36).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "500":
          $ref: "#/components/responses/Problema"
    delete:
      operationId: removerOptOut
      summary: Remover o Opt-out (voltar a receber)
      description: |
        Única forma de remover um Opt-out; o histórico guarda qual Sistema de
        origem removeu e quando. A lista de supressão do próprio Provedor
        (SendGrid, STOP do Twilio) pode continuar bloqueando. Idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptOut"
      responses:
        "204":
          description: Opt-out removido (ou não existia).
        "400":
          $ref: "#/components/responses/Problema"
        "401":
          $ref: "#/components/responses/Problema"
        "403":
          description: Token do Console do Operador; ele não pede Notificações nem mexe em Opt-out (REQ-36).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "500":
          $ref: "#/components/responses/Problema"
  /v1/config/whatsapp:
    options:
      operationId: preflightConfigWhatsApp
      summary: Preflight de CORS do Console do Operador
      description: |
        Responde o preflight do navegador antes da autenticação (o navegador
        não manda o token aqui). Só a origem do Console do Operador
        (`OMINICORE_CONSOLE_ORIGEM`) é autorizada; outra origem recebe 403 sem
        cabeçalho de CORS (REQ-34). As rotas de envio e de Opt-out não têm CORS.
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
          example: https://ominicore.flipapi.com.br
      responses:
        "204":
          description: Origem do Console autorizada.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
              example: GET, PUT, DELETE
            Access-Control-Allow-Headers:
              schema:
                type: string
              example: Authorization, Content-Type
            Access-Control-Max-Age:
              schema:
                type: integer
              example: 600
        "403":
          $ref: "#/components/responses/Problema"
    get:
      operationId: consultarConfigWhatsApp
      summary: Consultar a configuração do Canal WhatsApp (Operador)
      description: |
        Só para o Operador: token com o papel de realm `ominicore-config`
        (RN-11). Devolve o Provedor e os campos públicos; de cada segredo,
        só se está configurado — nunca o valor (REQ-23).
      responses:
        "200":
          description: Configuração atual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigWhatsApp"
              example:
                ligado: true
                provedor: zapi
                campos:
                  instance_id: 3C4F2A
                segredos:
                  token: true
                  client_token: false
        "401":
          $ref: "#/components/responses/Problema"
        "403":
          $ref: "#/components/responses/Problema"
        "503":
          $ref: "#/components/responses/Problema"
    put:
      operationId: gravarConfigWhatsApp
      summary: Gravar o Provedor e as credenciais do WhatsApp (Operador)
      description: |
        Substitui a configuração inteira no OpenBao e vale sem reiniciar: a
        api na hora, o worker na próxima releitura (`OMINICORE_CONFIG_RELEITURA`,
        padrão 30 s). Campos exigidos: `meta` = `token`, `phone_number_id`,
        `meta_app_secret`, `meta_verify_token`; `ultramsg` e `zapi` =
        `instance_id`, `token` (`zapi` aceita `client_token`). Outros campos
        são ignorados. A credencial não é testada no Provedor. Cada troca fica
        registrada com o Operador (`azp`), sem segredo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GravarConfigWhatsApp"
            example:
              provedor: zapi
              instance_id: 3C4F2A
              token: "<token da instância>"
              client_token: "<token de segurança da conta>"
      responses:
        "200":
          description: Gravada; devolve a visão sem segredos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigWhatsApp"
        "400":
          $ref: "#/components/responses/Problema"
        "401":
          $ref: "#/components/responses/Problema"
        "403":
          $ref: "#/components/responses/Problema"
        "422":
          description: Provedor desconhecido ou campo exigido faltando; nada é gravado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "500":
          description: Gravada, mas o registro da troca falhou (fica no log).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "503":
          $ref: "#/components/responses/Problema"
    delete:
      operationId: desligarWhatsApp
      summary: Desligar o Canal WhatsApp (Operador)
      description: |
        Apaga a configuração: o Canal passa a desligado (pulado na ordem;
        pedido só por WhatsApp = 422). Idempotente.
      responses:
        "204":
          description: Desligado (ou já estava).
        "401":
          $ref: "#/components/responses/Problema"
        "403":
          $ref: "#/components/responses/Problema"
        "500":
          $ref: "#/components/responses/Problema"
        "503":
          $ref: "#/components/responses/Problema"
  /v1/config/whatsapp/webhooks:
    options:
      operationId: preflightWebhooksZAPI
      summary: Preflight de CORS do Console do Operador (recadastro)
      description: Como o de `/v1/config/whatsapp`, só com o método `POST` (REQ-34).
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Origem do Console autorizada.
        "403":
          $ref: "#/components/responses/Problema"
    post:
      operationId: recadastrarWebhooksZAPI
      summary: Recadastrar na Z-API as URLs dos Avisos de status (Operador)
      description: |
        Cadastra de novo na Z-API as URLs de "Ao enviar" e de "Status" com o
        segredo atual, sem trocá-lo (REQ-41). A resposta traz o estado do
        cadastro em `campos.webhooks_estado`; o segredo nunca sai. Só com a
        Z-API ativa: senão 409, sem efeito.
      responses:
        "200":
          description: Recadastro tentado; o estado diz se a Z-API aceitou.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigWhatsApp"
        "401":
          $ref: "#/components/responses/Problema"
        "403":
          $ref: "#/components/responses/Problema"
        "409":
          $ref: "#/components/responses/Problema"
        "503":
          $ref: "#/components/responses/Problema"
components:
  securitySchemes:
    keycloak:
      type: oauth2
      description: Token client_credentials do realm `ominicore`; o `azp` identifica o Sistema de origem.
      flows:
        clientCredentials:
          tokenUrl: http://keycloak:8080/realms/ominicore/protocol/openid-connect/token
          scopes: {}
  responses:
    Problema:
      description: Erro no formato RFC 9457 (problem+json).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
  schemas:
    PedidoNotificacao:
      type: object
      additionalProperties: false
      required: [template_id, destinatario, dados]
      properties:
        template_id:
          type: string
          description: Template cadastrado no OminiCore.
        destinatario:
          type: object
          additionalProperties: false
          properties:
            email:
              type: string
              format: email
            telefone:
              type: string
              description: Formato E.164.
              pattern: '^\+[1-9]\d{7,14}$'
              example: "+5511999998888"
        canais:
          type: array
          description: |
            Ordem de Canais desta Notificação (sem repetição); ausente = a do
            Template. Canal sem versão no Template é recusado com 422.
            Canais do MVP: `email`, `sms`, `whatsapp` (contato =
            `destinatario.telefone`). O WhatsApp sai pelo Provedor do ambiente:
            Meta (Modelo aprovado), UltraMsg ou Z-API (texto da versão
            WhatsApp); a versão sem a forma do Provedor ativo é recusada com
            422 "versão whatsapp sem texto" ou "versão whatsapp sem modelo
            aprovado". Com o UltraMsg ou a Z-API não há Aviso de status: a
            Tentativa de WhatsApp aceita fica `enviada`. Canal desligado no ambiente (WhatsApp sem
            credenciais) é pulado; sem Canal disponível, o pedido é recusado
            com 422 "canal whatsapp indisponível".
          uniqueItems: true
          minItems: 1
          items:
            type: string
        dados:
          type: object
          description: Valores das variáveis do Template (todas obrigatórias).
          additionalProperties:
            type: string
    NotificacaoAceita:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pendente, enviada, entregue, falhou]
    Consulta:
      type: object
      required: [id, template_id, status, criada_em, atualizada_em, tentativas]
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
        status:
          type: string
          enum: [pendente, enviada, entregue, falhou]
        criada_em:
          type: string
          format: date-time
        atualizada_em:
          type: string
          format: date-time
        anonimizada_em:
          type: string
          format: date-time
          description: Quando contato, dados e motivo foram apagados pela retenção (RN-9); ausente = ainda não.
        tentativas:
          type: array
          items:
            type: object
            required: [canal, numero, status, criada_em, atualizada_em]
            properties:
              canal:
                type: string
              numero:
                type: integer
              status:
                type: string
                enum: [pendente, enviada, entregue, lida, falhou]
              categoria_falha:
                type: string
                enum: [contato_invalido, recusado_pelo_provedor, retentativas_esgotadas, opt_out]
              criada_em:
                type: string
                format: date-time
              atualizada_em:
                type: string
                format: date-time
    OptOut:
      type: object
      additionalProperties: false
      required: [canal, contato]
      properties:
        canal:
          type: string
          enum: [email, sms, whatsapp]
        contato:
          type: string
          description: E-mail (Canal email) ou telefone E.164 (Canais sms e whatsapp).
    ConfigWhatsApp:
      type: object
      description: Configuração do Canal WhatsApp sem segredos (REQ-23).
      required: [ligado]
      properties:
        ligado:
          type: boolean
        provedor:
          type: string
          enum: [meta, ultramsg, zapi]
        campos:
          type: object
          description: |
            Campos que não são segredo (`instance_id`, `phone_number_id`). Com a
            Z-API, também o estado do cadastro dos webhooks na Z-API
            (`webhooks_estado`: `cadastrados` ou `falhou`; `webhooks_em`, RFC 3339 —
            REQ-40). O segredo da URL dos avisos aparece só em `segredos`
            (`webhook_segredo`).
          additionalProperties:
            type: string
        segredos:
          type: object
          description: Para cada segredo do Provedor, se está configurado.
          additionalProperties:
            type: boolean
    GravarConfigWhatsApp:
      type: object
      required: [provedor]
      properties:
        provedor:
          type: string
          enum: [meta, ultramsg, zapi]
      additionalProperties:
        type: string
    Problema:
      type: object
      required: [status, title]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
