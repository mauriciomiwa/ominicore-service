version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/adaptadores/saida/postgres/queries.sql
    gen:
      go:
        package: db
        out: internal/adaptadores/saida/postgres/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
